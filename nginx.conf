# ============================================================================
# Token Hub — Nginx 反向代理配置
# ============================================================================
#
# 部署位置: /etc/nginx/conf.d/token-hub.conf
# 验证配置: nginx -t && systemctl reload nginx
#
# 架构:
#
#     浏览器 ──HTTPS──> Nginx ──HTTP──> Go 服务 (127.0.0.1:3001)
#                          │
#                          └──> 静态文件 (web/dist 前端构建产物)
#
# Nginx 承担两件事:
#   1. 托管前端静态文件 —— Go 服务本身不提供任何静态文件服务
#   2. 把 /api、/v1、/health 反向代理到 Go 服务
#
# ----------------------------------------------------------------------------
# ⚠️ 部署前必读
# ----------------------------------------------------------------------------
#
# 【1】必须同步配置 TRUSTED_PROXIES  ★最容易漏、后果最严重★
#
#     在项目 .env 中设置:
#
#         TRUSTED_PROXIES=127.0.0.1/32
#
#     Token Hub 默认「不信任任何代理头」，以防止客户端伪造 X-Forwarded-For
#     绕过登录限流。当它部署在 Nginx 之后时，必须显式告诉它信任谁。
#
#     漏配的后果: 所有请求的客户端 IP 都会是 127.0.0.1，登录限流把全部用户
#     视为同一来源 —— 任意 5 次登录失败就会锁死所有人 5 分钟。
#
#     如果 Nginx 不在本机（或在 Docker 中，源 IP 是 docker0 网关如
#     172.17.0.1），请把上面的值改成 Nginx 的实际出口 IP/网段。
#
#     此值必须【精确】：填 0.0.0.0/0 等于信任一切，X-Forwarded-For 重新变得
#     可伪造，限流又会失效。
#
# 【2】必须确保 Go 服务端口不对外暴露
#
#     Go 服务监听 :3001。用防火墙只放行本机 Nginx:
#
#         ufw deny 3001
#
#     否则攻击者可绕过 Nginx 直连 3001，本配置的 TLS、限流、
#     安全响应头将全部失效。
#
# 【3】上传体积
#
#     /v1/uploads/images 单文件上限 10MB（+64KB multipart 开销）。
#     Nginx 默认 client_max_body_size 仅 1MB，不放开的话上传会在到达应用
#     之前就被 Nginx 以 413 拒绝。本配置已设为 12m。
#
# 【4】安全响应头的分工
#
#     Go 服务的中间件已经为所有 API 响应下发了 X-Content-Type-Options /
#     X-Frame-Options / Referrer-Policy / Permissions-Policy / Cache-Control。
#     因此本配置【不】在代理的 location 中重复设置这些头，避免响应里出现
#     重复字段。
#
#     Nginx 只负责它独有的两项:
#       - HSTS: 只有终止 TLS 的 Nginx 才知道协议，应用侧无从判断
#       - CSP : 只对 HTML 文档有意义，而 HTML 由 Nginx 提供
#
# ============================================================================


# ---- 登录接口限流（纵深防御）----
#
# 本文件位于 /etc/nginx/conf.d/ 下，默认被 nginx.conf 的 http {} 块包含，
# 因此这里可以直接定义 http 上下文的 limit_req_zone。
#
# 为什么要在 Nginx 层再做一层:
#   应用自身的登录限流每次都要先走到 Go 服务，而登录校验使用 bcrypt
#   （故意设计成计算昂贵）。凭证填充攻击即使全部失败，也会先把你的 CPU 打满。
#   在 Nginx 层拦掉明显的洪泛，成本几乎为零。
#
# 限流粒度: 按真实客户端 IP（Nginx 是边缘节点，$binary_remote_addr 即真实 IP）。
# 阈值刻意取得比应用宽松（应用是 5 次失败 / 5 分钟），Nginx 只负责挡住
# 明显的机器人洪泛，精细策略仍由应用负责，避免误伤 NAT 后的正常用户。
#
limit_req_zone $binary_remote_addr zone=token_hub_login:10m rate=30r/m;


# ---- 上游:Go 服务 ----
upstream token_hub_backend {
    server 127.0.0.1:3001;

    # 与后端保持长连接，减少握手开销。
    # 需配合下方 proxy_set_header Connection ""; 才生效。
    keepalive 32;
}


# ---- 日志格式 ----
# 刻意使用 $uri 而非 $request:
# $request 形如 "GET /v1/models?foo=bar"，会把查询串写进日志。
# Token Hub 已不再接受 URL 中的凭证，但查询串仍可能含业务参数，
# 不应落入日志或流向日志聚合平台。
log_format token_hub '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';


# ============================================================================
# HTTP — 仅用于跳转到 HTTPS
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name example.com;   # ← 改成你的域名

    # Let's Encrypt 续期校验放行（certbot --webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================================
# HTTPS — 主服务
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # nginx >= 1.25.1 用下面这行开启 HTTP/2。
    # 更早的版本请删掉本行，改用: listen 443 ssl http2;
    http2 on;

    server_name example.com;   # ← 改成你的域名

    # ---- TLS 证书 ----
    # certbot 申请成功后会自动写入这些路径
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 注意: OCSP stapling 需要证书中带 OCSP URI。
    # Let's Encrypt 已逐步停用 OCSP（改用 CRLite/短周期证书），新签发的证书
    # 可能不再包含该字段，此时 ssl_stapling 会产生周期性告警而毫无收益。
    # 如果你的证书仍提供 OCSP（可用 openssl x509 -in fullchain.pem -text | grep -i ocsp 确认），
    # 可以取消下面三行的注释:
    #
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 1.1.1.1 valid=300s;

    # ---- 基础硬化 ----
    server_tokens off;            # 不泄露 Nginx 版本号
    client_max_body_size 12m;     # 见上文【3】
    client_body_timeout 60s;
    client_header_timeout 60s;

    # HSTS 放在 server 级，使 API 响应也带上（Go 服务不设置该头，不会重复）。
    # 下方静态 location 因自身有 add_header，需重复声明一次。
    #
    # ⚠️ 首次上线建议先用短周期观察，确认 HTTPS 完全正常后再改成 1 年：
    #     add_header Strict-Transport-Security "max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 前端静态文件根目录 ----
    # 部署方式:
    #     npm run build && rsync -a --delete web/dist/ /var/www/token-hub/
    root /var/www/token-hub;
    index index.html;

    # ========================================================================
    # 代理公共配置（server 级，自动被下方各 proxy location 继承）
    # ========================================================================
    #
    # 这些头让 Gin 能还原真实客户端 IP（用于登录限流与访问日志）。
    # 必须与 .env 中的 TRUSTED_PROXIES 配合，见上文【1】。
    #
    # X-Forwarded-For 使用 $proxy_add_x_forwarded_for：它把真实客户端 IP
    # 【追加】到链尾。即使客户端预先伪造了 XFF，Gin 也会从右往左第一个
    # 「不在信任列表中的 IP」即真实客户端 IP，伪造值被忽略。
    #
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";   # 配合 upstream keepalive

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ========================================================================
    # 代理路由
    # ========================================================================

    # ---- 健康检查 ----
    location = /health {
        access_log off;
        proxy_pass http://token_hub_backend;
    }

    # ---- 登录接口 ----
    # 精确匹配优先级高于下面的 /api/ 前缀，用于叠加限流。
    # 超时未显式声明，将使用 nginx 默认值（60s），对本接口足够。
    location = /api/auth/login {
        limit_req zone=token_hub_login burst=10 nodelay;
        limit_req_status 429;      # 与应用返回的 429 保持一致，便于客户端统一处理
        proxy_pass http://token_hub_backend;
    }

    # ---- 用户 / 管理员 API ----
    location /api/ {
        proxy_pass http://token_hub_backend;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- OpenAI 兼容 API ----
    # 图像生成是「提交任务」语义：应用侧调用上游供应商的超时是 30s，
    # 这里留足余量，避免 Nginx 先于应用超时断开，让用户看到 504 而非
    # 应用的错误信息。
    location /v1/ {
        proxy_pass http://token_hub_backend;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 上传单文件上限 10MB，Nginx 默认会在转发前把请求体完整缓冲到
        # 临时文件；这正好可以挡住 slow-loris 式的慢速上传，因此保持默认
        # （缓冲开启），不要设置 proxy_request_buffering off。
    }

    # ========================================================================
    # 静态资源
    # ========================================================================
    # 注意: nginx 中只要某个 location 出现 add_header，父级的 add_header
    # 就不再被继承。因此下面每个静态 location 都显式重复声明所需的安全头。

    # Vite 产物带内容哈希，可放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # index.html 不缓存，确保前端发版后用户立即拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 前端为 Vite 构建的 SPA，样式由 Tailwind 生成（需要 'unsafe-inline'）。
        # 上线后若出现图标/样式不显示，先临时注释掉本行定位问题。
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA 路由回退
    # React Router 的前端路由（/dashboard、/admin/* 等）在服务端没有对应文件，
    # 必须回退到 index.html，否则用户刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 拒绝隐藏文件 ----
    # 防止 .env、.git 等被误部署到 web 根目录时可以直接下载。
    #
    # 必须排除 .well-known：正则 location 的优先级高于前缀 location，
    # 写成 location ~ /\. 会把 /.well-known/acme-challenge/... 一并拒掉，
    # 导致证书续期失败。否定环视 (?!well-known) 用于放行该路径。
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}


# ============================================================================
# 上线后的自检清单
# ============================================================================
#
# 1. 服务端已生效:
#      curl -sI https://example.com/api/pricing | grep -i strict-transport
#      → 应看到 Strict-Transport-Security
#
# 2. C1 修复已生效（不得出现 api_key）:
#      curl -s https://example.com/api/pricing | grep -c api_key
#      → 应为 0
#
# 3. 凭证不能走 URL（应返回 401）:
#      curl -s -o /dev/null -w '%{http_code}\n' \
#           "https://example.com/v1/models?token=sk-anything"
#      → 应为 401
#
# 4. 真实客户端 IP 已被还原（否则说明 TRUSTED_PROXIES 漏配）:
#      用外部 IP 登录失败几次，查看 Go 服务日志中的 source IP
#      → 应是你自己的公网 IP，而不是 127.0.0.1
#
# 5. 上传 10MB 文件不应出现 413:
#      curl -s -o /dev/null -w '%{http_code}\n' \
#           -H "Authorization: Bearer sk-xxx" \
#           -F "file=@10mb.png" https://example.com/v1/uploads/images
#
# ============================================================================
